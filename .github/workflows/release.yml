name: Release

# Triggered by a manually pushed "vX.Y.Z" tag:
#   git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew build --stacktrace

      - name: Changelog for this version
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Tagify ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
          make_latest: true
          files: build/libs/Tagify.jar

      # Modrinth publish - only runs if the MODRINTH_TOKEN secret is set.
      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/Tagify.jar
          name: Tagify ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog: ${{ steps.changelog.outputs.content }}
          loaders: |
            paper
            purpur
            folia
          game-versions: '>=1.20.6'
          java: '21'
          dependencies: |
            luckperms(optional)
            placeholderapi(optional)
            vault(optional)
