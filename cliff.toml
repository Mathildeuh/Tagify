# Configuration git-cliff — génération du changelog à partir des Conventional Commits.
# https://git-cliff.org

[changelog]
header = """
# Changelog\n
Toutes les modifications notables de Tagify sont documentées ici.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Non publié]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}** : {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = "v0.0.0"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Nouveautés" },
    { message = "^fix", group = "<!-- 1 -->Corrections" },
    { message = "^perf", group = "<!-- 2 -->Performances" },
    { message = "^refactor", group = "<!-- 3 -->Refactorisation" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(test|ci|build|chore)", skip = true },
    { body = ".*security", group = "<!-- 5 -->Sécurité" },
    { message = "^revert", group = "<!-- 6 -->Reverts" },
    { message = ".*", group = "<!-- 7 -->Divers" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
